<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrolling Text</title>
    <style>
        body {
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        #scroll-container {
            position: relative;
            width: 100%;
            height: 50px;
            overflow: hidden;
            white-space: nowrap;
        }

        .scrolling-sentence {
            position: absolute;
            font-size: 24px;
            white-space: nowrap;
            top: 50%;
            transform: translateY(-50%);
        }

        /* Hidden text measurer */
        #text-measurer {
            position: absolute;
            visibility: hidden;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div id="scroll-container"></div>
    <div id="text-measurer"></div> <!-- Hidden element for width measurement -->

    <script>
        let textQueue = [];
        let fetchInProgress = false;
        let lastSentenceEnd = 0;
        const scrollSpeed = 300; // Pixels per second
        const scrollContainer = document.getElementById("scroll-container");
        const textMeasurer = document.getElementById("text-measurer");

        function processQueue() {
            if (textQueue.length > 0) {
                let nextSentence = textQueue.shift();

                // Measure width in hidden element
                textMeasurer.textContent = nextSentence;
                let sentenceWidth = textMeasurer.offsetWidth;

                let sentenceSpan = document.createElement("span");
                sentenceSpan.textContent = nextSentence;
                sentenceSpan.classList.add("scrolling-sentence");
                scrollContainer.appendChild(sentenceSpan);

                let delay = Math.max(lastSentenceEnd - performance.now(), 0);
                let duration = ((window.innerWidth + sentenceWidth) / scrollSpeed) * 800;
                
                lastSentenceEnd = performance.now() + delay + duration;

                // Initial position
                sentenceSpan.style.left = "100%";
                sentenceSpan.style.transition = `transform ${duration}ms linear`;

                // Start animation
                setTimeout(() => {
                    sentenceSpan.style.transform = `translateX(-${window.innerWidth + sentenceWidth}px)`;
                }, delay);

                // Remove sentence from DOM after it fully scrolls off
                setTimeout(() => {
                    sentenceSpan.remove();
                    processQueue(); // ✅ Start the next sentence only after this one leaves
                }, delay + duration);
            } else {
                // If queue is empty, check again after 1 second
                setTimeout(processQueue, 1000);
            }

            // ✅ Fetch more text only when necessary
            if (textQueue.length < 3 && !fetchInProgress) {
                fetchMoreText();
            }
        }



        function fetchMoreText() {
            if (!fetchInProgress) {
                fetchInProgress = true;
                fetch('/api/get-text')
                    .then(response => response.json())
                    .then(data => {
                        textQueue.push(...data.output.match(/[^.!?]+[.!?]/g));
                        fetchInProgress = false;
                    })
                    .catch(error => {
                        console.error("Error fetching text:", error);
                        fetchInProgress = false;
                    });
            }
        }

        fetchMoreText();
        processQueue();
    </script>
</body>
</html>
